[pytest]
testpaths = .
addopts = -ra --strict-markers --timeout=900
timeout_func_only = true
markers =
    smoke: one of every path, a few minutes with the install
    slow: takes minutes on its own (the conformance set)
    reboot: the test or its module reboots the Amiga (C:Reboot); deselected by --no-reboot
    hooks: needs vchiq.device built with EMU68_VCHIQ_TEST_HOOKS; skipped otherwise
    profile: needs the profile tier in the installed build; skipped otherwise
    listen: someone at the machine records what they hear; selected only with --listen
    hands: needs the user's hands (an external reset); selected only with --hands
    gates: the code gates and traceability, no machine (run.sh gates)
